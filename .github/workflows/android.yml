name: Build ALAM Keyboard APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ALAM_AI_Stylish_Keyboard.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          test -f ALAM_AI_Stylish_Keyboard.zip
          mkdir -p extracted
          unzip -q -o ALAM_AI_Stylish_Keyboard.zip -d extracted
          test -f extracted/settings.gradle.kts
          test -f extracted/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: extracted
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ALAM-AI-Stylish-Keyboard-APK
          path: extracted/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
